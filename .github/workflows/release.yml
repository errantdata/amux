name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: ubuntu-24.04-arm
            target: linux-aarch64
          - os: macos-latest
            target: macos-universal
            # one tarball for Apple Silicon and Intel; the macos-13 runner
            # that used to build the Intel half no longer schedules
            cflags_extra: -arch arm64 -arch x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Build
        run: |
          ./configure
          make CFLAGS_EXTRA="${{ matrix.cflags_extra }}"
          ./amux -v

      - name: Test
        run: make check

      - name: Stage tarball
        run: |
          VERSION=$(sed -n 's/^VERSION = //p' Makefile)
          DIR="amux-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$DIR"
          cp amux "dist/$DIR/"
          cp amux.1 README.md LICENSE DESIGN.md "dist/$DIR/"
          cp contrib/amux.zsh "dist/$DIR/_amux"
          tar -C dist -czf "dist/$DIR.tar.gz" "$DIR"
          rm -rf "dist/$DIR"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: amux-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file covering every artifact, so install.sh or a Homebrew
      # formula can verify what it downloaded.
      - name: Checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Source tarball
        run: |
          VERSION=$(sed -n 's/^VERSION = //p' Makefile)
          git archive --prefix="amux-${VERSION}/" \
              -o "artifacts/amux-${VERSION}.tar.gz" HEAD
          cd artifacts && sha256sum "amux-${VERSION}.tar.gz" >> SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
