name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25          # a hung test should fail, not burn an hour
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest      # x86_64 glibc
          - ubuntu-24.04-arm   # aarch64 glibc
          - macos-latest       # Apple Silicon
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: ./configure

      - name: Build
        run: make

      - name: Version banner
        run: ./amux -v

      # The build must stay clean under the strict flag set; the fork's own
      # code is warning-free and regressions here are usually real bugs.
      - name: Build with warnings as errors
        run: |
          make clean
          make CFLAGS_EXTRA="-Wall -Wextra -pedantic -Werror \
                             -Wstrict-prototypes -Wold-style-definition \
                             -Wmissing-prototypes \
                             -Wno-unused-parameter -Wno-sign-compare"

      # The release builds one macOS tarball for both architectures; prove it
      # works on every push rather than discovering it at tag time.
      - name: Universal binary (macOS)
        if: runner.os == 'macOS'
        run: |
          make clean
          make CFLAGS_EXTRA="-arch arm64 -arch x86_64"
          file amux
          file amux | grep -q "universal" || { echo "not a universal binary"; exit 1; }
          make clean && make

      # Surface the failing checks as annotations: log bodies need auth, so a
      # bare "exit code 2" is all an outside observer can otherwise see.
      - name: Test
        run: |
          set -o pipefail
          make check 2>&1 | tee test.log || {
            grep '^\[FAIL\]' test.log | sed 's/^/::error::/'
            exit 1
          }

      # Log bodies need auth, so when something fails on a runner we cannot
      # reproduce, push the facts out through annotations instead.
      - name: Diagnose (only on failure)
        if: failure()
        run: |
          note() { echo "::error::DIAG $*"; }
          note "uname: $(uname -a)"
          note "hostname: $(hostname) (${#HOSTNAME} chars)"
          note "TMPDIR: ${TMPDIR:-unset}"
          D=$(python3 -c 'import tempfile; print(tempfile.mkdtemp(prefix="diag."))')
          note "mkdtemp: $D (${#D} chars)"
          export AMUX_SOCKET_DIR="$D"
          out=$(./amux -n smoke sh -c 'echo hello-smoke; sleep 5' 2>&1); rc=$?
          note "create rc=$rc out='$out'"
          sleep 2
          note "list: $(./amux 2>&1 | tail -n +2 | tr '\n' ';')"
          note "history bytes: $(./amux -H smoke 2>&1 | wc -c)"
          note "history head: $(./amux -H smoke 2>&1 | head -c 120 | tr -d '\r' | tr '\n' '|')"
          note "socket dir tree: $(find "$D" -maxdepth 3 2>&1 | tr '\n' ';')"
          note "ring tmpfiles: $(ls -la /tmp/.mux-scrollback-* 2>&1 | head -2 | tr '\n' ';')"

  alpine:
    name: alpine (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 25          # a hung test should fail, not burn an hour
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: apk add --no-cache build-base python3 linux-headers
      - name: Configure and build
        run: ./configure && make
      - name: Test
        run: |
          set -o pipefail
          make check 2>&1 | tee test.log || {
            grep '^\[FAIL\]' test.log | sed 's/^/::error::/'
            exit 1
          }
